services:

  # ---------------------------------------------------------------
  # MySQL 8 — base de datos de desarrollo
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tallerdae-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tallerdae-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------
  # Nginx — servidor web estático y futuro proxy reverso
  # ---------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: tallerdae-nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - tallerdae-net
    depends_on:
      mysql:
        condition: service_healthy

# ---------------------------------------------------------------
# Volúmenes
# ---------------------------------------------------------------
volumes:
  mysql_data:
    name: tallerdae-mysql-data

# ---------------------------------------------------------------
# Red interna
# ---------------------------------------------------------------
networks:
  tallerdae-net:
    name: tallerdae-network
    driver: bridge
