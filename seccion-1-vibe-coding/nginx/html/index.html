<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller DAE — Ambiente de Desarrollo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 640px;
        }

        .badge {
            display: inline-block;
            background: #1e40af;
            color: #93c5fd;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        h1 span {
            color: #3b82f6;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .services {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .service-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            min-width: 140px;
        }

        .service-card .icon {
            font-size: 1.75rem;
            margin-bottom: 0.4rem;
        }

        .service-card .name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .service-card .status {
            font-size: 0.75rem;
            color: #4ade80;
            margin-top: 0.2rem;
        }

        .footer {
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Ambiente Local</div>
        <h1>Bienvenido al<br><span>Taller DAE</span></h1>
        <p class="subtitle">
            Ambiente de desarrollo y pruebas levantado correctamente.<br>
            Todos los servicios están corriendo con Docker Compose.
        </p>

        <div class="services">
            <div class="service-card">
                <div class="icon">🐬</div>
                <div class="name">MySQL 8</div>
                <div class="status">● activo</div>
            </div>
            <div class="service-card">
                <div class="icon">🌐</div>
                <div class="name">Nginx</div>
                <div class="status">● activo</div>
            </div>
            <div class="service-card">
                <div class="icon">🔌</div>
                <div class="name">Backend</div>
                <div class="status" style="color:#f59e0b;">● pendiente</div>
            </div>
        </div>

        <p class="footer">tallerdae · localhost:8080</p>
    </div>
</body>
</html>
