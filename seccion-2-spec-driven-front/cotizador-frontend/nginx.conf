server {
    listen 80;
    server_name localhost;

    # Sirve los archivos estáticos del frontend
    root /usr/share/nginx/html;
    index index.html;

    # Cualquier ruta que no sea /api la resuelve como estático
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso hacia el backend Java
    # El frontend llama a /api/... y Nginx lo reenvía al contenedor del backend
    location /api/ {
        proxy_pass         http://172.17.0.2:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Evita errores CORS: el proxy hace las llamadas servidor-a-servidor
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
