services:
  db:
    image: mysql:8.0
    container_name: tallerdae-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tallerdae}
      MYSQL_USER: ${MYSQL_USER:-devuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpassword123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tallerdae-net

  backend:
    build:
      context: ../seccion-2-spec-driven-back/cotizador-backend
      dockerfile: ../../seccion-3-despliegue-integrado/cotizador-backend/Dockerfile
    container_name: tallerdae-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    networks:
      - tallerdae-net

  web:
    image: nginx:alpine
    container_name: tallerdae-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../seccion-2-spec-driven-front/cotizador-frontend:/usr/share/nginx/html:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - tallerdae-net

volumes:
  db_data:

networks:
  tallerdae-net:
    driver: bridge
